# Build the site and publish it to Cloudflare Pages with Wrangler (up to 20,000 files, 25 MiB each).
# Runs on every push to main, and can be started by hand (Actions -> Deploy site -> Run workflow).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages - Edit) and CLOUDFLARE_ACCOUNT_ID.
# Optional DISPATCH_TOKEN (fine-grained GitHub token, this repo only, Actions: Read and write) lets /api/live start
# the results workflow as soon as a draw is complete.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 tools/build.py --results malaysia_4d_draws_2021-2026.csv --dict 4d_dictionary_template.csv --img-src sprites --text dict_text --site https://www.4dmalamini.com/ --out dist
      - name: Create the Pages project (first run only)
        run: npx --yes wrangler@4.156.2 pages project create 4dmalamini --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Pass the auto-save token to the site (only if the DISPATCH_TOKEN secret exists)
        if: ${{ env.DT != '' }}
        run: printf '%s' "$DT" | npx --yes wrangler@4.156.2 pages secret put GH_DISPATCH --project-name 4dmalamini
        env:
          DT: ${{ secrets.DISPATCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4.156.2 pages deploy dist --project-name 4dmalamini --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
