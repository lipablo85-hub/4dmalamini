# Nightly 4D results. One run checks every minute during draw hours until every draw due today is saved
# (or the time limit is reached), committing each new result and publishing the site straight away.
# Started by a schedule below and/or by hand (Actions -> Nightly 4D results -> Run workflow).
# Jackpots, Toto 5D/6D/lotto and blank prize slots go to extras.json (from check4d.org).
name: Nightly 4D results
on:
  schedule:   # several starts per session, because GitHub sometimes skips a scheduled run; extra starts exit in seconds
    - cron: "58 6 * * *"    # 14:58 MYT (Super J3 3pm)
    - cron: "8 7 * * *"     # 15:08
    - cron: "25 7 * * *"    # 15:25
    - cron: "35 10 * * *"   # 18:35 MYT (Singapore 4D 6:30pm)
    - cron: "55 10 * * *"   # 18:55 MYT
    - cron: "5 11 * * *"    # 19:05
    - cron: "20 11 * * *"   # 19:20
    - cron: "40 11 * * *"   # 19:40
    - cron: "10 12 * * *"   # 20:10 catch-up
    - cron: "58 12 * * *"   # 20:58 (Super J9 9pm)
    - cron: "8 13 * * *"    # 21:08
    - cron: "25 13 * * *"   # 21:25
  workflow_dispatch:
    inputs:
      minutes:
        description: "Keep checking for this many minutes"
        default: "60"
permissions:
  contents: write
  actions: write
concurrency:
  group: results
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Check every minute until tonight's draws are in
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes || '60' }}
        run: |
          CSV=malaysia_4d_draws_2021-2026.csv
          git config user.name "4d-results-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + MINUTES * 60 ))
          left=$(python3 tools/fetch_results.py --csv $CSV --pending)
          [ -z "$left" ] && { echo "nothing due right now"; exit 0; }
          while :; do
            python3 tools/fetch_results.py --csv $CSV || true
            if ! git diff --quiet -- $CSV extras.json || [ -n "$(git status --porcelain extras.json)" ]; then
              git add $CSV extras.json
              git commit -qm "Results $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M')"
              git pull -q --rebase origin main && git push -q origin HEAD:main && gh workflow run deploy.yml --ref main && echo "published"
            fi
            left=$(python3 tools/fetch_results.py --csv $CSV --pending)
            [ -z "$left" ] && { echo "all of today's draws are in"; break; }
            [ $(date +%s) -ge $end ] && { echo "time limit; still waiting for: $left"; break; }
            sleep 60
          done
