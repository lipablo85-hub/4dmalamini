name: Pull 4D Lucky Book dictionaries (data branch only)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - run: mkdir -p /tmp/lb && python3 tools/luckybook_fetch.py /tmp/lb 1 2 3 | tee /tmp/lb/report.txt
      - run: |
          du -sh /tmp/lb; ls /tmp/lb
          cd /tmp/lb && git init -q -b luckybook-data && git config user.name "4d-results-bot" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "4D Lucky Book pull (not merged)" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" luckybook-data
