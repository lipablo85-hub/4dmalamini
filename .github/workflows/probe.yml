name: Probe result sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir probe && cd probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          f(){ curl -sSL -A "$UA" -e "$3" --max-time 30 -o "$1" "$2" || echo "fail $1"; ls -la "$1" || true; }
          f gd.html "https://gdlotto.net/results/today/" https://gdlotto.net/
          f 9lotto.html "https://9lotto.com/result" https://9lotto.com/
          f gd4d_9l.html "https://gd4d.co/en/9-lotto-4d" https://gd4d.co/
          f 4dyes_9l.html "https://4dyes3.com/en/9lotto" https://4dyes3.com/
      - run: |
          cd probe && git init -q -b probe && git add -A && git -c user.name=probe -c user.email=probe@local commit -qm probe
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe:probe-data
