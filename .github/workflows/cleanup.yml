name: cleanup
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Re-point the backup tag at the cleaned history
        run: |
          git push -q origin :refs/tags/data-20261110-0201 || true
          git tag data-20261110-0201 && git push -q origin data-20261110-0201 && echo "tag moved"
      - name: Delete workflow runs from before the history cleanup
        run: |
          n=0
          for id in $(gh api --paginate "repos/$R/actions/runs?per_page=100" -q '.workflow_runs[].id'); do
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh api -X DELETE "repos/$R/actions/runs/$id" >/dev/null 2>&1 && n=$((n+1))
          done
          echo "deleted $n runs"
