name: Backfill Singapore 4D history
on: workflow_dispatch
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fill_sg_official.py malaysia_4d_draws_2021-2026.csv 5350=2025-07-09 5362=2025-08-06 5363=2025-08-09 5364=2025-08-10 5365=2025-08-13 5366=2025-08-16 5367=2025-08-17
      - run: |
          git config user.name "4d-results-bot"; git config user.email "actions@users.noreply.github.com"
          git add malaysia_4d_draws_2021-2026.csv && git commit -qm "Singapore 4D: fill 7 draws from Singapore Pools" || exit 0 && git pull -q --rebase origin main && git push -q
