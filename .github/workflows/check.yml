name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          mkdir probe && cd probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          f(){ curl -sSL -A "$UA" -e "$3" --max-time 30 -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "fail $1"; }
          f c4dsp.html "https://www.check4d.org/4d-special-draw" https://www.check4d.org/
          f c4d_sp.html "https://www.check4d.org/special-draw-date" https://www.check4d.org/
          f c4d_sp2.html "https://www.check4d.org/special-draw-dates" https://www.check4d.org/
          f magnum.html "https://www.magnum4d.my/en/special-draw" https://www.magnum4d.my/
          git init -q -b probe && git add -A && git -c user.name=p -c user.email=p@l commit -qm probe
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe:probe-data
