name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Redirect hops from each entry point
        run: |
          for U in http://4dmalamini.com/ https://4dmalamini.com/ http://www.4dmalamini.com/ https://www.4dmalamini.com/; do
            printf '%-34s hops=%s  final=%s\n' "$U" \
              "$(curl -sIL -o /dev/null -w '%{num_redirects}' "$U")" \
              "$(curl -sIL -o /dev/null -w '%{url_effective}' "$U")"
          done
      - name: Cache-Control by page type
        run: |
          S=https://www.4dmalamini.com
          for U in / /keputusan/2026-11-04/ /4d/8888/ /magnum-4d-result/ /magnum-4d-result/2025/ /privacy/ /live.json; do
            printf '%-30s %s\n' "$U" "$(curl -sI "$S$U" | grep -i '^cache-control:' | tr -d '\r' | cut -c16-)"
          done
      - name: Zone settings relevant to the above (read-only)
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CF" -H 'Content-Type: application/json' "$@"; }
          ZID=$(api 'https://api.cloudflare.com/client/v4/zones?name=4dmalamini.com' | jq -r '.result[0].id // empty')
          [ -z "$ZID" ] && { echo "  zone not readable"; exit 0; }
          for S in always_use_https ssl security_header; do
            api "https://api.cloudflare.com/client/v4/zones/$ZID/settings/$S" \
              | jq -r --arg s "$S" 'if .success then "  \($s) = \(.result.value|tostring)" else "  \($s): unreadable" end'
          done
