name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Small logos live
        run: |
          for u in img/op/sm/k.webp img/op/sm/n-s.webp img/op/sm/d-n.webp img/op/k.webp; do curl -s -o /dev/null -w "$u %{http_code} %{size_download}B\n" "https://www.4dmalamini.com/$u"; done
          curl -s https://www.4dmalamini.com/zh/ | grep -o 'img/op/[a-z/-]*\.webp' | sort | uniq -c | head -5
      - name: Lighthouse insight details (home)
        run: |
          npm i -g lighthouse@12 >/dev/null 2>&1
          for u in "" zh/; do
            lighthouse "https://www.4dmalamini.com/$u" --only-categories=performance --form-factor=mobile --screenEmulation.mobile \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=l.json --quiet >/dev/null 2>&1
            lighthouse "https://www.4dmalamini.com/$u" --only-categories=performance --form-factor=mobile --screenEmulation.mobile \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=l.json --quiet >/dev/null 2>&1
            echo "== /$u score $(jq '.categories.performance.score' l.json)"
            for a in cache-insight image-delivery-insight legacy-javascript-insight network-dependency-tree-insight uses-long-cache-ttl modern-image-formats uses-responsive-images legacy-javascript third-party-summary; do
              jq -r --arg a "$a" '.audits[$a] // empty | "-- \($a): \(.displayValue // "") score=\(.score)", ((.details.items // [])[:12][] | "   " + ([.url // .entity // "", (.wastedBytes // .totalBytes // .transferSize // "" | tostring), (.cacheLifetimeMs // .ttl // "" | tostring), ((.subItems.items // [])[:6] | map(.signal // .reason // .url // "") | join(";"))] | map(tostring) | join(" | ")))' l.json
            done
          done
