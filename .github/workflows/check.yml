name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Footer "latest results" link per language, live
        run: |
          curl -s https://www.4dmalamini.com/ -o /tmp/h
          for L in en ms zh ta; do
            printf '  %-3s %s\n' "$L" \
              "$(jq -r --arg l "$L" '.[$l]' /tmp/fl.json 2>/dev/null || true)"
          done || true
          echo "--- first link of each language variant in FLINKS"
          grep -o 'const FLINKS={.*};' /tmp/h | sed 's/^const FLINKS=//; s/;$//' > /tmp/fl.json
          for L in en ms zh ta; do
            printf '  %-3s %s\n' "$L" "$(jq -r --arg l "$L" '.[$l]' /tmp/fl.json | grep -o 'href="[^"]*"' | head -1)"
          done
      - name: No Malay-namespace link on the non-Malay footers
        run: |
          curl -s https://www.4dmalamini.com/ -o /tmp/h
          grep -o 'const FLINKS={.*};' /tmp/h | sed 's/^const FLINKS=//; s/;$//' > /tmp/fl.json
          FAIL=0
          for L in en zh ta; do
            BAD=$(jq -r --arg l "$L" '.[$l]' /tmp/fl.json | grep -o 'href="/keputusan/[0-9][^"]*"' | head -3)
            if [ -n "$BAD" ]; then echo "  LEAK in $L: $BAD"; FAIL=1; fi
          done
          [ "$FAIL" = 0 ] && echo "  clean: no /keputusan/<date>/ link in the en, zh or ta footer"
      - name: Redirect and cache still correct
        run: |
          for U in http://4dmalamini.com/ https://www.4dmalamini.com/; do
            printf '  %-32s hops=%s code=%s\n' "$U" \
              "$(curl -sIL -o /dev/null -w '%{num_redirects}' "$U")" \
              "$(curl -sIL -o /dev/null -w '%{http_code}' "$U")"
          done
          printf '  %-32s %s\n' "/keputusan/2026-11-04/" \
            "$(curl -sI https://www.4dmalamini.com/keputusan/2026-11-04/ | grep -i '^cache-control:' | tr -d '\r' | cut -c16-)"
