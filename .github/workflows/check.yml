name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Statistics page in four languages
        run: |
          S=https://www.4dmalamini.com
          for u in 4d-statistics ms/4d-statistics zh/4d-statistics ta/4d-statistics; do
            curl -s "$S/$u/" -o /tmp/p
            printf '%-22s %s  tiles=%s  html=%sB gz\n' "/$u/" \
              "$(curl -s -o /dev/null -w '%{http_code}' $S/$u/)" \
              "$(grep -o 'class="fchip' /tmp/p | wc -l)" \
              "$(curl -s -H 'Accept-Encoding: gzip' -o /dev/null -w '%{size_download}' $S/$u/)"
            grep -o 'Showing[^<]*<b>[^<]*' /tmp/p | head -1 | sed 's/^/     default: /'
            grep -o '显示 <b>[^<]*' /tmp/p | head -1 | sed 's/^/     default: /'
          done
      - name: Deferred filter asset is cached and deferred
        run: |
          A=$(curl -s https://www.4dmalamini.com/4d-statistics/ | grep -o '/assets/stf-en\.[a-z0-9]*\.js')
          echo "asset: $A"
          curl -s https://www.4dmalamini.com/4d-statistics/ | grep -o '<script src="[^"]*stf[^"]*"[^>]*>' | head -1
          curl -sI "https://www.4dmalamini.com$A" | grep -iE '^(cache-control|content-length):' | sed 's/^/  /'
      - name: Sprite the tiles use
        run: |
          printf '  /img/op/tk.webp -> %s, %s\n' \
            "$(curl -s -o /dev/null -w '%{http_code}' https://www.4dmalamini.com/img/op/tk.webp)" \
            "$(curl -sI https://www.4dmalamini.com/img/op/tk.webp | grep -i '^cache-control' | tr -d '\r' | cut -c16-)"
