name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Favicon probe
        run: |
          S=https://www.4dmalamini.com
          for u in / /favicon.svg /favicon-32.png /favicon.ico /icon-192.png /apple-touch-icon.png /robots.txt; do
            curl -s -o /dev/null -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" -w "$u %{http_code} %{content_type} %{size_download}B\n" "$S$u"
          done
          curl -s "$S/" | grep -o '<link[^>]*icon[^>]*>'
          for d in www.4dmalamini.com 4dmalamini.com; do
            curl -sL -o g.png -w "google s2 $d %{http_code} %{size_download}B\n" "https://www.google.com/s2/favicons?domain=$d&sz=64"; sha1sum g.png
          done
          curl -sL -o x.png "https://www.google.com/s2/favicons?domain=nonexistent-abc-123456.com&sz=64"; echo "default globe:"; sha1sum x.png
