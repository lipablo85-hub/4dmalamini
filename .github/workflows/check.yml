name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          npm i -s playwright@1 >/dev/null 2>&1 && npx -y playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const errs=[];
          for(const u of ['https://www.4dmalamini.com/?d=20260127','https://www.4dmalamini.com/zh/?d=20260127','https://www.4dmalamini.com/ta/?d=20260127']){
          const p=await b.newPage();p.on('pageerror',e=>errs.push(e.message));
          await p.goto(u);await p.waitForTimeout(1500);const l1=await p.$eval('#rdlabel',e=>e.textContent).catch(()=>'-');
          await p.waitForTimeout(5000);console.log('RES',u,'| 1.5s:',l1,'| 6.5s:',await p.$eval('#rdlabel',e=>e.textContent),'| M 1st:',await p.$eval('#rc-M .t3 button,#rc-M .s3 button',e=>e.textContent).catch(()=>'-'));await p.close()}
          console.log('ERRS',JSON.stringify(errs));await b.close()})();
          JS
          node t.js
