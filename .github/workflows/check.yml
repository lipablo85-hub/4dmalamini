name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Heat map caption live in four languages
        run: |
          S=https://www.4dmalamini.com
          for u in 4d-statistics ms/4d-statistics zh/4d-statistics ta/4d-statistics; do
            curl -s "$S/$u/?v=$RANDOM" -o /tmp/p
            printf '%-20s %s  ' "/$u/" "$(curl -s -o /dev/null -w '%{http_code}' $S/$u/)"
            grep -o '<p class="hcap">[^<]*' /tmp/p | cut -c17-80 || echo "NO CAPTION"
            A=$(grep -o '/assets/stf-[a-z]*\.[a-z0-9]*\.js' /tmp/p | head -1)
            printf '     asset %s hcap-in-js=%s\n' "$A" "$(curl -s $S$A | grep -c hcap)"
          done
