name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Redirect chain from every entry point
        run: |
          for U in http://4dmalamini.com/ https://4dmalamini.com/ http://www.4dmalamini.com/ \
                   http://4dmalamini.com/keputusan/2026/ https://4dmalamini.com/4d/8888/; do
            echo "--- $U"
            curl -s -o /dev/null -w '    %{http_code}  %{redirect_url}\n' "$U"
            printf '    hops=%s  total=%ss\n' \
              "$(curl -sIL -o /dev/null -w '%{num_redirects}' "$U")" \
              "$(curl -sL -o /dev/null -w '%{time_total}' "$U")"
          done
      - name: Cache headers by page type
        run: |
          S=https://www.4dmalamini.com
          for U in / /ms/ /keputusan/2026-11-04/ /keputusan/2026/11/ /4d/8888/ /magnum-4d-result/ \
                   /check-4d-number/ /assets/ /sitemap.xml /live.json; do
            echo "--- $U"
            curl -sI "$S$U" | grep -iE '^(cache-control|cf-cache-status|age|etag|last-modified|content-encoding|vary):' | sed 's/^/    /'
          done
      - name: Does a second hit come from cache?
        run: |
          S=https://www.4dmalamini.com
          for U in /keputusan/2026-11-04/ /4d/8888/ /keputusan/2026/; do
            curl -s -o /dev/null "$S$U"; sleep 1
            printf '%-26s  status=%-10s ttfb=%ss\n' "$U" \
              "$(curl -sI "$S$U" | grep -i cf-cache-status | tr -d '\r' | cut -d' ' -f2)" \
              "$(curl -s -o /dev/null -w '%{time_starttransfer}' "$S$U")"
          done
      - name: Compression actually served
        run: |
          curl -s -H 'Accept-Encoding: br,gzip' -o /dev/null -w \
            '  br/gzip bytes: %{size_download}, encoding: %header{content-encoding}\n' \
            https://www.4dmalamini.com/keputusan/2026-11-04/
