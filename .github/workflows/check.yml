name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Map 4dluckybook (2)
        run: |
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"
          B=https://4dluckybook.com
          echo "== bookitemlist.js"; curl -s -A "$UA" "$B/scripts/home/bookitemlist.js" | head -c 4000; echo
          echo "== index.js (grep)"; curl -s -A "$UA" "$B/scripts/home/index.js" | grep -o '.\{0,120\}\(menu\|ajax\|\.php\|url\).\{0,120\}' | head -20
          echo "== home menu"; curl -s -A "$UA" "$B/home/" | grep -o 'menu=[a-z]*[^"]\{0,30\}"[^<]\{0,200\}' | sort -u | head -30
          echo "== book 3 first"; curl -s -A "$UA" "$B/home/?menu=bookitem&id=3" | grep -o 'alt="[^"]*"' | head -4
          echo "== book 1 entry 000/020 names"; curl -s -A "$UA" "$B/home/?menu=bookitem&id=1" | grep -o "src='[^']*bookitem[^']*'" | head -3
