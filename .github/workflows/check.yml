name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Strip only on home pages
        run: |
          S=https://www.4dmalamini.com
          for u in "" ms/ zh/ ta/ keputusan/2026-11-04/ 4d/8888/ zh/magnum-4d-result/ info/; do
            printf '%-26s %s strip=%s\n' "/$u" "$(curl -s -o /dev/null -w '%{http_code}' "$S/$u?v=$RANDOM")" "$(curl -s "$S/$u?v=$RANDOM" | grep -c 'class="tkr"')"
          done
