name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Logo intro live on the home page in four languages
        run: |
          S=https://www.4dmalamini.com
          for u in "" ms/ zh/ ta/; do
            curl -s "$S/$u?v=$RANDOM" -o /tmp/p
            printf '%-5s %s  mD=%s  mask=%s  cdr=%s  gz=%sB\n' "/$u" \
              "$(curl -s -o /dev/null -w '%{http_code}' $S/$u)" \
              "$(grep -c 'class="mark mk mD"' /tmp/p)" \
              "$(grep -o '<mask id="cm"' /tmp/p | wc -l)" \
              "$(grep -o 'class="cdr"' /tmp/p | wc -l)" \
              "$(curl -s -H 'Accept-Encoding: gzip' -o /dev/null -w '%{size_download}' "$S/$u?v=$RANDOM")"
          done
