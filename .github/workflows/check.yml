name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Info typography live
        run: |
          S=https://www.4dmalamini.com
          for u in info/ ms/info/ zh/info/ ta/info/; do
            H=$(curl -s "$S/$u?v=$RANDOM"); C=$(echo "$H" | grep -o 'assets/i\.[0-9a-f]*\.css' | head -1)
            printf '/%-9s %s css=%s font=%s typo=%s\n' "$u" "$(curl -s -o /dev/null -w '%{http_code}' $S/$u)" "$C" "$(echo "$H" | grep -c 'jakarta\.')" "$(curl -s $S/$C | grep -c 'text-wrap:balance')"
          done
          curl -s "$S/zh/info/?v=$RANDOM" | grep -o '每周3次' | head -1
