name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in 4d-statistics zh/4d-statistics ms/4d-statistics ta/4d-statistics popular-4d-numbers zh/popular-4d-numbers special-draw data-policy; do
            printf "%-26s %s  " "/$u/" "$(curl -s -o /tmp/p -w '%{http_code}' https://www.4dmalamini.com/$u/)"
            grep -o '<title>[^<]*' /tmp/p | head -1 | cut -c8-70; echo
          done
          echo "sitemap:"; curl -s https://www.4dmalamini.com/sitemap.xml | grep -o '4d-statistics\|popular-4d-numbers' | sort | uniq -c
          echo "home links:"; curl -s https://www.4dmalamini.com/ | grep -o 'href="[^"]*\(statistics\|popular-4d\)[^"]*"' | sort -u | head
