name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          f(){ printf '%s %s ' "$1" "$(curl -sSL -A "$UA" -e "$3" --max-time 25 -o /tmp/$1 -w '%{http_code}' "$2")"; grep -oiE "nine ?lotto|9 ?lotto" /tmp/$1 | head -1; echo; }
          f a.html "https://loto4d.com/past-results" https://loto4d.com/
          f b.html "https://loto4d.com/9-lotto-4d-results" https://loto4d.com/
          f c.html "https://loto4d.com/results/2026-10-27" https://loto4d.com/
          f d.html "https://www.4dmoon.com/9-lotto-results/" https://www.4dmoon.com/
          f e.html "https://9lotto.com/result" https://9lotto.com/
          f g.html "https://loto4d.com/" https://loto4d.com/
          echo "LOTO LINKS:"; grep -oE 'href="[^"]*(past|history|archive|result)[^"]*"' /tmp/g.html | sort -u | head -20
