name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sabah 88 live
        run: |
          S=https://www.4dmalamini.com
          for u in sabah-88-4d-result/ ms/sabah-88-4d-result/ zh/sabah-88-4d-result/ ta/sabah-88-4d-result/ sabah-88-4d-result/2024/ img/op/b.webp img/op/tk11.webp; do
            printf '%-32s %s %sB\n' "/$u" "$(curl -s -o /dev/null -w '%{http_code}' $S/$u)" "$(curl -s -o /dev/null -w '%{size_download}' $S/$u)"
          done
          curl -s "$S/?v=$RANDOM" | grep -o 'id="rc-B"[^>]*>' | head -1
          curl -s "$S/?v=$RANDOM" | grep -o 'rc-C.\{0,4\}' | head -1
          curl -s "$S/live.json?v=$RANDOM" | grep -o '"B":"[^|"]\{0,60\}' | head -1
          echo "api B:"; curl -s "$S/api/live" | grep -o '"B":{[^}]*}' | head -c 300; echo
          curl -s "$S/sitemap-operators.xml" | grep -c sabah-88 || true
