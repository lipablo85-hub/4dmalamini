name: Check sources (dry run)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sS -m 25 "https://www.4dmalamini.com/api/live?x=$RANDOM" | python3 -c "import sys,json;j=json.load(sys.stdin);[print('LIVE',k,v['d'],v['top'],len([x for x in v['sl'] if x]),len([x for x in v['co'] if x])) for k,v in j['ops'].items() if k in 'JK']"
          python3 tools/fetch_results.py --csv malaysia_4d_draws_2021-2026.csv --dry-run --date 2026-11-03 2>&1 | grep -i "J3\|J9" || true
