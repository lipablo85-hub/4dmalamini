name: Check sources (dry run)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys,re;sys.path.insert(0,'tools');import fetch_results as F
          t=re.sub(r'\s+',' ',F.html_text(F.get('https://9lotto.com/result',{'Referer':'https://9lotto.com/'})))
          print('PARSE',F.parse_9lotto(t));i=t.find('DRAW NO');print('PAGE',t[i:i+900])
          l=re.sub(r'\s+',' ',F.html_text(F.get('https://loto4d.com/',{'Referer':'https://loto4d.com/'})));i=l.find('Nine Lotto Date');print('LOTO',l[i:i+500])
          PY
