name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cloudflare Web Analytics disable (no secrets printed)
        env:
          T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          B="https://api.cloudflare.com/client/v4/accounts/$ACC/rum/site_info"
          curl -s -H "Authorization: Bearer $T1" "$B/list" | jq -c '[.result[] | {site_tag, site_token, host:.ruleset.zone_name, auto_install, enabled:.ruleset.enabled}]'
          S=$(curl -s -H "Authorization: Bearer $T1" "$B/list" | jq -r '.result[] | select(.site_token=="bf09b2436dd8467a9948306d2dde5cf9" or .ruleset.zone_name=="4dmalamini.com") | .site_tag' | head -1)
          Z=$(curl -s -H "Authorization: Bearer $T1" "$B/$S" | jq -r '.result.ruleset.zone_tag')
          curl -s -X PUT -H "Authorization: Bearer $T1" -H "Content-Type: application/json" "$B/$S" \
            -d "{\"auto_install\":false,\"enabled\":false,\"zone_tag\":\"$Z\",\"host\":\"4dmalamini.com\"}" | jq -c '{success, errors:[.errors[]?.message], auto_install:.result.auto_install, enabled:.result.ruleset.enabled}'
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          for k in 1 2 3 4 5 6; do sleep 30; echo "t+$((k*30))s beacon: $(curl -s -A "$UA" -H 'Accept: text/html' "https://www.4dmalamini.com/?x=$RANDOM" | grep -c cloudflareinsights)"; done
      - name: Small logos live
        run: |
          for u in img/op/sm/k.webp img/op/sm/n-s.webp img/op/sm/d-n.webp img/op/k.webp; do curl -s -o /dev/null -w "$u %{http_code} %{size_download}B\n" "https://www.4dmalamini.com/$u"; done
          curl -s https://www.4dmalamini.com/zh/ | grep -o 'img/op/[a-z/-]*\.webp' | sort | uniq -c | head -5
      - name: Lighthouse insight details (home)
        run: |
          npm i -g lighthouse@12 >/dev/null 2>&1
          for u in "" zh/; do
            lighthouse "https://www.4dmalamini.com/$u" --only-categories=performance --form-factor=mobile --screenEmulation.mobile \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=l.json --quiet >/dev/null 2>&1
            lighthouse "https://www.4dmalamini.com/$u" --only-categories=performance --form-factor=mobile --screenEmulation.mobile \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=l.json --quiet >/dev/null 2>&1
            echo "== /$u score $(jq '.categories.performance.score' l.json)"
            for a in cache-insight image-delivery-insight legacy-javascript-insight network-dependency-tree-insight uses-long-cache-ttl modern-image-formats uses-responsive-images legacy-javascript third-party-summary; do
              jq -r --arg a "$a" '.audits[$a] // empty | "-- \($a): \(.displayValue // "") score=\(.score)", ((.details.items // [])[:12][] | "   " + ([.url // .entity // "", (.wastedBytes // .totalBytes // .transferSize // "" | tostring), (.cacheLifetimeMs // .ttl // "" | tostring), ((.subItems.items // [])[:6] | map(.signal // .reason // .url // "") | join(";"))] | map(tostring) | join(" | ")))' l.json
            done
          done
