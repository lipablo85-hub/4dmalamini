name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trust pages live in four languages
        run: |
          S=https://www.4dmalamini.com
          for u in privacy terms contact ms/privacy ms/terms ms/contact zh/privacy zh/terms zh/contact ta/privacy ta/terms ta/contact; do
            printf "%-16s %s  " "/$u/" "$(curl -s -o /tmp/p -w '%{http_code}' $S/$u/)"
            grep -o '<title>[^<]*' /tmp/p | head -1 | cut -c8-60; echo
          done
      - name: IndexNow key file
        run: |
          KEY=$(curl -s https://www.4dmalamini.com/7f4b3a3244116bcf1b830ea88d5bb236.txt)
          echo "served: $KEY"
          test "$KEY" = "7f4b3a3244116bcf1b830ea88d5bb236" && echo "matches the key we submit" || echo "MISMATCH"
      - name: Re-submit to IndexNow now that the key file is definitely live
        run: |
          B='{"host":"www.4dmalamini.com","key":"7f4b3a3244116bcf1b830ea88d5bb236","keyLocation":"https://www.4dmalamini.com/7f4b3a3244116bcf1b830ea88d5bb236.txt","urlList":["https://www.4dmalamini.com/privacy/","https://www.4dmalamini.com/terms/","https://www.4dmalamini.com/contact/","https://www.4dmalamini.com/check-4d-number/","https://www.4dmalamini.com/ms/check-4d-number/"]}'
          for EP in https://api.indexnow.org/indexnow https://www.bing.com/indexnow; do
            printf '%-40s -> %s\n' "$EP" "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$EP" -H 'Content-Type: application/json' -d "$B")"
          done
      - name: Schema on the contact page
        run: |
          curl -s https://www.4dmalamini.com/contact/ -o /tmp/c
          grep -o '"@type":"[A-Za-z]*"' /tmp/c | sort | uniq -c
          echo "publishingPrinciples: $(grep -c publishingPrinciples /tmp/c)"
      - name: Sitemap totals
        run: |
          curl -s https://www.4dmalamini.com/sitemap.xml -o /tmp/s
          for f in $(grep -o 'sitemap-[a-z]*\.xml' /tmp/s | sort -u); do
            printf '  %-26s %s urls\n' "$f" "$(curl -s https://www.4dmalamini.com/$f | grep -c '<loc>')"
          done
