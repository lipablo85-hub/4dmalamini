name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          echo "LIVE: $(curl -sS --max-time 30 'https://www.4dmalamini.com/api/live?x='$RANDOM | head -c 3000)"
          echo "J3API: $(curl -sS --max-time 30 -A 'Mozilla/5.0' -e https://superj3.net/ 'https://superj3.net/data/data-api.php?op=get_landing_info&api_key=e0a5d3fsdfdsghhg18b0c8bgfdgd7c06e&ao=1' | head -c 1500)"
