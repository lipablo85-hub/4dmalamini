name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PageSpeed Insights (mobile)
        run: |
          for u in "" zh/ keputusan/2026-11-05/ zh/magnum-4d-result/ 4d/8888/ zh/4d-statistics/; do
            for k in 1 2 3; do
              curl -s --max-time 120 "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Fwww.4dmalamini.com%2F${u//\//%2F}&strategy=mobile&category=performance" -o p.json
              jq -e .lighthouseResult p.json >/dev/null 2>&1 && break; sleep 20
            done
            jq -r --arg u "/$u" '[$u,
              "score=" + ((.lighthouseResult.categories.performance.score // 0) * 100 | floor | tostring),
              "FCP=" + (.lighthouseResult.audits["first-contentful-paint"].displayValue // "-"),
              "LCP=" + (.lighthouseResult.audits["largest-contentful-paint"].displayValue // "-"),
              "TBT=" + (.lighthouseResult.audits["total-blocking-time"].displayValue // "-"),
              "CLS=" + (.lighthouseResult.audits["cumulative-layout-shift"].displayValue // "-"),
              "SI=" + (.lighthouseResult.audits["speed-index"].displayValue // "-"),
              "TTFB=" + (.lighthouseResult.audits["server-response-time"].displayValue // "-"),
              "bytes=" + ((.lighthouseResult.audits["total-byte-weight"].numericValue // 0) / 1024 | floor | tostring) + "KB",
              "field=" + (if .loadingExperience.metrics then ((.loadingExperience.overall_category // "?") + " LCPp75=" + ((.loadingExperience.metrics.LARGEST_CONTENTFUL_PAINT_MS.percentile // 0)|tostring) + " INPp75=" + ((.loadingExperience.metrics.INTERACTION_TO_NEXT_PAINT.percentile // 0)|tostring) + " CLSp75=" + ((.loadingExperience.metrics.CUMULATIVE_LAYOUT_SHIFT_SCORE.percentile // 0)|tostring)) else "none" end),
              "origin=" + (if .originLoadingExperience.metrics then (.originLoadingExperience.overall_category // "?") else "none" end),
              (.error.message // "")] | join("  ")' p.json
          done
