name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Sabah 88 block on check4d and 4d2ulive
        run: |
          cat > /tmp/p.py <<'PY'
          import sys, re
          sys.path.insert(0, "tools")
          import fetch_results as F
          def show(label, url, ref, start="Sabah 88"):
              try:
                  t = re.sub(r"\s+", " ", F.html_text(F.get(url, {"Referer": ref})))
              except Exception as e:
                  print(label, "ERROR", e); return
              i = t.find(start)
              print(f"== {label} len={len(t)} first@{i} count={t.count(start)}")
              for m in re.finditer(re.escape(start), t):
                  print("  ..", t[m.start():m.start()+900]); print()
          show("check4d home", "https://www.check4d.org/", "https://www.check4d.org/")
          show("check4d 2026-11-04", "https://www.check4d.org/past-results/2026-11-04", "https://www.check4d.org/")
          show("check4d 2021-11-03", "https://www.check4d.org/past-results/2021-11-03", "https://www.check4d.org/")
          show("4d2ulive 2026-11-04", "https://4d2ulive.com/past-results/2026-11-04", "https://4d2ulive.com/")
          show("4d2ulive 2021-11-03", "https://4d2ulive.com/past-results/2021-11-03", "https://4d2ulive.com/")
          PY
          python3 /tmp/p.py
