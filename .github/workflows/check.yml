name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the existing redirect configuration (no writes)
        env:
          CF: ${{ secrets.CF_ZONE_TOKEN }}
        run: |
          if [ -z "$CF" ]; then echo "CF_ZONE_TOKEN is not set on this repo"; exit 1; fi
          api() { curl -s -H "Authorization: Bearer $CF" -H 'Content-Type: application/json' "$@"; }
          ZID=$(api 'https://api.cloudflare.com/client/v4/zones?name=4dmalamini.com' | jq -r '.result[0].id // empty')
          if [ -z "$ZID" ]; then echo "cannot read the zone - check Zone:Zone:Read on the token"; exit 1; fi
          echo "zone readable"
          echo "::add-mask::$ZID"
          echo "--- dynamic redirect entrypoint ruleset"
          api "https://api.cloudflare.com/client/v4/zones/$ZID/rulesets/phases/http_request_dynamic_redirect/entrypoint" > /tmp/ds.json
          jq -r 'if .success then "  ruleset exists, id captured, rules: \(.result.rules // [] | length)" else "  no entrypoint ruleset yet or unreadable: " + (.errors|map(.message)|join("; ")) end' /tmp/ds.json
          jq -r '(.result.rules // [])[] | "  * \(.description // "(no description)")\n      enabled: \(.enabled)\n      when:    \(.expression)\n      then:    \(.action) \(.action_parameters|tostring)"' /tmp/ds.json
          echo "--- page rules (may be unreadable; that is fine)"
          api "https://api.cloudflare.com/client/v4/zones/$ZID/pagerules" \
            | jq -r 'if .success then ((.result|length|tostring) + " page rule(s)"), (.result[] | "  * \([.targets[].constraint.value]|join(","))  ->  \(.actions|tostring)  [\(.status)]") else "  unreadable: " + (.errors|map(.message)|join("; ")) end'
          echo "--- current hop counts"
          for U in http://4dmalamini.com/ https://4dmalamini.com/ http://www.4dmalamini.com/; do
            printf '  %-32s hops=%s final=%s\n' "$U" \
              "$(curl -sIL -o /dev/null -w '%{num_redirects}' "$U")" \
              "$(curl -sIL -o /dev/null -w '%{url_effective}' "$U")"
          done
