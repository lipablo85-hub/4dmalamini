name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          echo "SPECIAL: $(curl -sS 'https://www.4dmalamini.com/zh/special-draw/' | grep -o 'href="[^"]*d=2026[0-9]*"' | head -3 | tr '\n' ' ')"
          echo "HOMEZH: $(curl -sS 'https://www.4dmalamini.com/zh/?d=20261027' | grep -o 'P.get("d")' | head -1)"
          npm i -s playwright@1 >/dev/null 2>&1 && npx -y playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:1280,height:900}});const errs=[];p.on('pageerror',e=>errs.push(e.message));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
          for(const [u,sel] of [['https://www.4dmalamini.com/zh/special-draw/','.ds a >> nth=0'],['https://www.4dmalamini.com/zh/special-draw/','.ds a >> nth=20'],['https://www.4dmalamini.com/special-draw/','.ds a >> nth=3'],['https://www.4dmalamini.com/ms/special-draw/','.ds a >> nth=0'],['https://www.4dmalamini.com/keputusan/2026-10-27/','a.arch'],['https://www.4dmalamini.com/zh/','footer a >> nth=2']]){
          await p.goto(u);const h=await p.getAttribute(sel,'href');await p.click(sel);await p.waitForTimeout(7000);
          console.log('RES',u,sel,'href='+h,'->',p.url(),'|',await p.$eval('#rdlabel',e=>e.textContent).catch(e=>'(no rdlabel) '+(document=>'')()),'|',(await p.title()).slice(0,60))}
          console.log('ERRS',JSON.stringify(errs));await b.close()})();
          JS
          node t.js
