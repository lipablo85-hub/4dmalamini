name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: New number-search hub
        run: |
          S=https://www.4dmalamini.com
          for u in check-4d-number ms/check-4d-number zh/check-4d-number ta/check-4d-number; do
            printf "%-28s %s  " "/$u/" "$(curl -s -o /tmp/p -w '%{http_code}' $S/$u/)"
            grep -o '<title>[^<]*' /tmp/p | head -1 | cut -c8-72; echo
          done
      - name: Footer translations shipped to the client
        run: |
          curl -s https://www.4dmalamini.com/ -o /tmp/h
          echo "FLINKS present: $(grep -c 'const FLINKS=' /tmp/h)"
          for w in 成绩 号码 关于 各公司成绩 Keputusan Maklumat முடிவுகள் எண்கள்; do
            printf "%-14s %s\n" "$w" "$(grep -c "$w" /tmp/h)"
          done
      - name: Sitemap index
        run: |
          curl -s https://www.4dmalamini.com/sitemap.xml -o /tmp/s
          echo "root is index: $(grep -c sitemapindex /tmp/s)"
          for f in $(grep -o 'sitemap-[a-z]*\.xml' /tmp/s | sort -u); do
            printf "  %-26s %s urls\n" "$f" "$(curl -s https://www.4dmalamini.com/$f | grep -c '<loc>')"
          done
          echo "robots:"; curl -s https://www.4dmalamini.com/robots.txt | tail -2
      - name: Freshness line and dateModified
        run: |
          curl -s https://www.4dmalamini.com/keputusan/2026-11-04/ -o /tmp/d
          grep -o '<p class="vfy">.*\?</p>' /tmp/d | sed 's/<[^>]*>//g' | head -c 200; echo
          echo "dateModified: $(grep -o '"dateModified":"[^"]*"' /tmp/d | head -1)"
          curl -s https://www.4dmalamini.com/4d/8888/ -o /tmp/n
          grep -o '<p class="vfy">.*\?</p>' /tmp/n | sed 's/<[^>]*>//g' | head -c 200; echo
