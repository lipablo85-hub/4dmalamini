name: Check sources (dry run)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Real fingerprinted assets
        run: |
          for A in assets/a.2530e22f.css img/op/m.webp; do
            printf '%-34s %s\n' "/$A" "$(curl -sI https://www.4dmalamini.com/$A | grep -i '^cache-control:' | tr -d '\r' | cut -c16-)"
          done
