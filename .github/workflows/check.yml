name: Check sources (dry run)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          curl -sS -m 25 -A "Mozilla/5.0 Chrome/130" https://loto4d.com/ | python3 -c "
          import sys,re,html;t=sys.stdin.read();t=re.sub(r'<script.*?</script>|<style.*?</style>',' ',t,flags=re.S);t=html.unescape(re.sub(r'<[^>]+>',' ',t));t=re.sub(r'\s+',' ',t)
          i=t.find('Nine Lotto Date');print('NINE',t[i:i+900])"
