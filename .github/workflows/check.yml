name: Check sources (dry run)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -m 25 "https://www.4dmalamini.com/api/live?x=$RANDOM" | python3 -c "import sys,json;j=json.load(sys.stdin);[print('LIVE',k,v['d'],v['no'],v['top'],len([x for x in v['sl'] if x]),len([x for x in v['co'] if x])) for k,v in j['ops'].items()]"
