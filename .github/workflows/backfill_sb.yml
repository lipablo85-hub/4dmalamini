name: Backfill Sabah 88 (artifact only)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/backfill_sb.py malaysia_4d_draws_2021-2026.csv /tmp/sabah88.csv | tee /tmp/sabah88_report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sabah88
          path: |
            /tmp/sabah88.csv
            /tmp/sabah88_report.txt
