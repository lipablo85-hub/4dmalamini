name: Copy Sabah 88 backfill to a data branch
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sabah88
          run-id: 42033798812
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data
      - run: |
          cd data && git init -q -b sabah88-data && git config user.name "4d-results-bot" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "Sabah 88 backfill rows (not merged)" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" sabah88-data
