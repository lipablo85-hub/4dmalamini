  const go=e.target.closest("[data-go]");if(go){const it=document.getElementById(go.dataset.go);if(it){it.setAttribute("aria-expanded","true");it.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}return}
  const sh=e.target.closest("[data-sh]");if(sh){const n=sh.dataset.sh,d=shareData(n),sp=sh.querySelector("span");
    if(navigator.share){ga("share",{method:"native",content_type:"dictionary",item_id:n});navigator.share(d).catch(()=>{})}
    else{ga("share",{method:"copy",content_type:"dictionary",item_id:n});try{navigator.clipboard.writeText(d.text+" "+d.url).then(()=>{sp.textContent=t("copied")},()=>{})}catch(err){}}return}
  const wc=e.target.closest("[data-wc]");if(wc){const d=shareData(wc.dataset.wc),txt=d.text+" "+d.url;ga("share",{method:"wechat",content_type:"dictionary",item_id:wc.dataset.wc});
    const go=()=>{toast("ok",t("wcCopied"),t("wcPaste"));if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent))setTimeout(()=>{location.href="weixin://"},900)};
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(go,()=>{prompt(t("wcPaste"),txt)});return}
  const sm=e.target.closest("[data-shm]");if(sm){ga("share",{method:sm.dataset.shm,content_type:"dictionary",item_id:sm.dataset.shn});return}
  const en=e.target.closest("[data-e]");if(en){ds.open=en.dataset.e;if(ds.open)ga("view_item",{content_type:"dictionary",item_id:ds.open});renderDict();hist()}});
/* "Search another number": appears once the search box is scrolled away; brings the cursor back to it */
{const ag=$("#dagain"),sb=document.querySelector(".dsearch");let out=false;
  const upd=()=>{const on=out&&!$("#p-dict").hidden;ag.classList.toggle("on",on);ag.setAttribute("aria-hidden",!on);ag.tabIndex=on?0:-1};
  if("IntersectionObserver"in window)new IntersectionObserver(es=>{out=!es[0].isIntersecting&&es[0].boundingClientRect.top<0;upd()}).observe(sb);
  document.addEventListener("click",e=>{if(e.target.closest('[role=tab],#nav-guide'))setTimeout(upd,50)});
  ag.onclick=()=>{const q=$("#dq");q.value="";ds.q="";ds.open=null;ds.page=1;renderDict();q.focus({preventScroll:true});
    sb.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
    sb.classList.remove("flash");void sb.offsetWidth;sb.classList.add("flash");hist();ga("select_content",{content_type:"dictionary_search_again"})}}
$("#dlucky").onclick=()=>{const n=String(Math.floor(Math.random()*1e4)).padStart(4,"0");ds.q=n;$("#dq").value=n;ds.open=n;ds.page=1;setTimeout(hist,0);ga("select_content",{content_type:"dictionary_random",item_id:n});renderDict();ensureDict(+n[0]).then(()=>{renderDict();const el=document.querySelector('[data-e="'+n+'"]');if(el)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})})};
$("#q").value=st.q;
all(1);
if(P.get("tab")==="dict")setTab("dict");else if(st.q||P.get("tab")==="check")setTab("check");else setTab("results");
syncLangUrl();try{history.replaceState({v:hview()},"",location.href)}catch(e){}HREADY=true;
}
(function load(n){fetch("live.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(start).catch(e=>{if(n<2)return setTimeout(()=>load(n+1),1500);const m=document.getElementById("err");m.innerHTML='Results history could not load ('+(e&&e.message||"network")+'). <button type="button" class="retry" onclick="location.reload()">Retry</button>'})})(1);
if("serviceWorker"in navigator&&location.protocol==="https:")addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
