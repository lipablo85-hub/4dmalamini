const pic=(e,alt,big)=>{
  if(!e.img)return`<span class="pic" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg></span>`;
  const o=+e.n,sz=big?400:240,c=o%25;return`<span class="pic mv" style="--ox:${20+o*37%60}%;--oy:${30+o*53%40}%"><i class="sp" role="img" aria-label="${esc(alt||t("dictTitle")+" "+e.n)}" style="background-image:url(img/d2/${sz}/${String(Math.floor(o/25)).padStart(3,"0")}.avif);background-position:${c%5*25}% ${Math.floor(c/5)*25}%"></i></span>`};
const SITE="__SITEURL__";
const ga=(n,p)=>{try{if(window.gtag)gtag("event",n,p)}catch(e){}};
function shareData(n){const x=DICT[+n],m=x[st.lang]||x.en||x.zh;return{title:"4D "+n+" · 4D Malam Ini",text:t("shareTxt",{n,m,z:st.lang==="zh"?(x.zh||m):x.zh}),url:SITE+"4d/"+n+"/"}}
function winLine(n){
  if(!FULL){loadFull().then(()=>{if(ds.open===n)renderDict()},()=>{});return`<span class="ld">${t("winLoading")}</span>`}
  const hs=hitsOf(n);if(!hs.length)return t("winNone");
  let b=null;hs.forEach(([oi,di,j])=>{const o=LIVE[oi],dr=o.D[di];if(!b||dr.d>b.dr.d)b={o,dr,j}});
  const p=b.j<3?t("p"+(b.j+1)):b.j<13?t("p4"):t("p5");
  return`<b>${t("winSum",{n:hs.length,y:fmt(MIN,{year:"numeric"})})}</b> · ${t("winLast",{d:fD(b.dr.d),o:oname(b.o),p})}`}
function dExtra(e){
  const d=shareData(e.n),u=encodeURIComponent(d.url),tx=encodeURIComponent(d.text);
  return`<div class="dx" style="grid-column:1/-1"><p class="dwin"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg><span>${winLine(e.n)}</span></p>`+
  `<div class="dsh" role="group" aria-label="${t("shareVia")}"><button type="button" class="sbtn main" data-sh="${e.n}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"></path></svg><span>${t("shareBtn")}</span></button>`+
  `<a class="sbtn wa" href="https://wa.me/?text=${tx}%20${u}" target="_blank" rel="noopener" data-shm="whatsapp" data-shn="${e.n}">WhatsApp</a>`+
  `<a class="sbtn tg2" href="https://t.me/share/url?url=${u}&text=${tx}" target="_blank" rel="noopener" data-shm="telegram" data-shn="${e.n}">Telegram</a>`+
  `<a class="sbtn fb" href="https://www.facebook.com/sharer/sharer.php?u=${u}" target="_blank" rel="noopener" data-shm="facebook" data-shn="${e.n}">Facebook</a></div></div>`}
function renderDict(){
  $("#dq").placeholder=t("dictSearch");
  $("#ranges").setAttribute("aria-label",t("rangeLbl"));
  const has=e=>e.img||e.zh||e.en||e.ms||e.ta;
  $("#ranges").innerHTML=Array.from({length:10},(_,i)=>{const c=DICT_STATS?DICT_STATS.chunks[i]:DICT.slice(i*1000,i*1000+1000).filter(has).length;return`<button type="button" data-r="${i}" aria-pressed="${!ds.q&&ds.r===i}"${c?"":" disabled"} style="${c?"":"opacity:.45"}"><span class="mono">${i}000–${i}999</span>${c?"":` · ${t("soon")}`}</button>`}).join("");
  const S=DICT_STATS||{pictures:DICT.filter(e=>e.img).length,zh:0,en:0,ms:0,ta:0};
  $("#prog").parentElement.hidden=S.pictures>=10000&&S.zh>=10000&&S.en>=10000&&S.ms>=10000&&S.ta>=10000;
  $("#prog").innerHTML=`<div style="grid-column:1/-1">${t("pictures")} · ${num(S.pictures)}/${num(10000)}<i><b style="width:${S.pictures/100}%;background:#E9C46B"></b></i></div>`+(S.zh||S.en?DL.map(([k,l])=>`<div>${l} · ${num(S[k])}/${num(10000)}<i><b style="width:${S[k]/100}%"></b></i></div>`).join(""):"");
  if(DICT_URLS&&needChunks().some(k=>!dlDone[k])){$("#dgrid").innerHTML='<div class="sk"></div>'.repeat(6);$("#dcount").textContent="";$("#dmore").hidden=true;return}
  const q=ds.q.trim().toLowerCase();
  let list;
  if(q){list=DICT.filter(e=>has(e)&&(/^\d+$/.test(q)&&e.n.startsWith(q))||(!/^\d+$/.test(q)&&(e.zh+"|"+e.en+"|"+e.ms+"|"+e.ta+"|"+e.cat).toLowerCase().includes(q)))}
  else list=DICT.slice(ds.r*1000,ds.r*1000+1000).filter(has);
  $("#dcount").textContent=t("entries",{n:list.length});
  const show=list.slice(0,ds.page*24);
  const mean=e=>e[st.lang==="ms"?"ms":st.lang]||e.en;
  $("#dgrid").innerHTML=show.length?show.map(e=>{const m=mean(e),op=ds.open===e.n;
    let h=`<button type="button" class="entry" data-e="${e.n}" aria-expanded="${op}">${pic(e,m,op)}<span class="mono">${e.n}</span>`;
    h+=m?`<span class="m">${esc(m)}</span>`:e.img?"":`<span class="m na">${t("notAdded")}</span>`;
    if(e.zh&&st.lang!=="zh")h+=`<span class="zh" lang="zh-Hans">${esc(e.zh)}</span>`;
    if(op)h+=`<span class="tr">${DL.map(([k,l])=>`<span>${l}</span><span class="${e[k]?"":"na"}">${e[k]?esc(e[k]):"—"}</span>`).join("")}</span>`;
    h+=`</button>`;if(op)h+=`<button type="button" class="share" data-n="${e.n}" style="grid-column:1/-1;justify-content:center;margin-top:0">${t("checkHist")} · <span class="mono">${e.n}</span></button>`+dExtra(e);return h}).join(""):`<p class="empty" style="grid-column:1/-1">${t("noMatch")}</p>`;
  $("#dmore").hidden=show.length>=list.length;
}
$("#dq").addEventListener("input",e=>{const v=e.target.value;ds.q=v;ds.page=1;renderDict();Promise.all(needChunks().map(k=>ensureDict(k))).then(()=>{if(ds.q===v)renderDict()})});
$("#dmore").onclick=()=>{ds.page++;renderDict()};
$("#tab-dict").onclick=()=>setTab("dict");
document.addEventListener("click",e=>{const r=e.target.closest("[data-r]");if(r){ds.r=+r.dataset.r;ds.q="";$("#dq").value="";ds.page=1;renderDict();ensureDict(ds.r).then(renderDict);return}
  const sh=e.target.closest("[data-sh]");if(sh){const n=sh.dataset.sh,d=shareData(n),sp=sh.querySelector("span");
    if(navigator.share){ga("share",{method:"native",content_type:"dictionary",item_id:n});navigator.share(d).catch(()=>{})}
    else{ga("share",{method:"copy",content_type:"dictionary",item_id:n});try{navigator.clipboard.writeText(d.text+" "+d.url).then(()=>{sp.textContent=t("copied")},()=>{})}catch(err){}}return}
  const sm=e.target.closest("[data-shm]");if(sm){ga("share",{method:sm.dataset.shm,content_type:"dictionary",item_id:sm.dataset.shn});return}
  const en=e.target.closest("[data-e]");if(en){ds.open=ds.open===en.dataset.e?null:en.dataset.e;if(ds.open)ga("view_item",{content_type:"dictionary",item_id:ds.open});renderDict()}});
$("#dlucky").onclick=()=>{const n=String(Math.floor(Math.random()*1e4)).padStart(4,"0");ds.q=n;$("#dq").value=n;ds.open=n;ds.page=1;ga("select_content",{content_type:"dictionary_random",item_id:n});renderDict();ensureDict(+n[0]).then(()=>{renderDict();const el=document.querySelector('[data-e="'+n+'"]');if(el)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})})};
$("#q").value=st.q;
all(1);
if(P.get("tab")==="dict")setTab("dict");else if(st.q||P.get("tab")==="check")setTab("check");else setTab("results");
}
(function load(n){fetch("live.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(start).catch(e=>{if(n<2)return setTimeout(()=>load(n+1),1500);const m=document.getElementById("err");m.innerHTML='Results history could not load ('+(e&&e.message||"network")+'). <button type="button" class="retry" onclick="location.reload()">Retry</button>'})})(1);
if("serviceWorker"in navigator&&location.protocol==="https:")addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
</script>
</body>
</html>
