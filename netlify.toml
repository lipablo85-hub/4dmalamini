# Netlify builds the site from this repository on every push.
[build]
  command = "python3 tools/build.py --results malaysia_4d_draws_2021-2026.csv --dict 4d_dictionary_template.csv --img-src sprites --text dict_text --site https://www.4dmalamini.com/ --out dist"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"
